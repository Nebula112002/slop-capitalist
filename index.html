<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slop Capitalist</title>
    <meta
      name="description"
      content="Idle tycoon about farming the algorithm. You do not make content. You make throughput."
    />
    <meta name="theme-color" content="#08070c" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Slop" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Boot paint. Without this the first frame is a white flash, which is the
         one thing that makes an installed app feel like a web page. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #08070c;
        color: #f6f1e8;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        font-family: "Bebas Neue", Impact, sans-serif;
        letter-spacing: 0.08em;
        font-size: 1.5rem;
      }
      #boot span {
        color: #2ef2a8;
      }
      #boot i {
        display: block;
        width: 96px;
        height: 4px;
        border-radius: 999px;
        background: rgba(246, 241, 232, 0.1);
        overflow: hidden;
      }
      #boot i::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #2ef2a8;
        animation: boot 1s ease-in-out infinite;
      }
      @keyframes boot {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i::after {
          animation: none;
        }
      }
      /* The app replaces #app's contents on first render; drop the splash then. */
      #app:not(:empty) + #boot {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" aria-hidden="true"><p><span>SLOP</span> CAPITALIST</p><i></i></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
