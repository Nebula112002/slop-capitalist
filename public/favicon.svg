<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Slop Capitalist">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191622"/>
      <stop offset="1" stop-color="#08070c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#2ef2a8" stroke-opacity="0.22"/>
  <!-- Three farm rows climbing, the way the list reads. -->
  <rect x="14" y="41" width="21" height="6" rx="3" fill="#2ef2a8" fill-opacity="0.45"/>
  <rect x="14" y="30" width="30" height="6" rx="3" fill="#2ef2a8" fill-opacity="0.72"/>
  <rect x="14" y="19" width="14" height="6" rx="3" fill="#2ef2a8"/>
  <!-- The payout. -->
  <circle cx="43" cy="22" r="5" fill="#ffd166"/>
</svg>
